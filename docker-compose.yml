services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: zerocode_db
      POSTGRES_USER: zerocode
      POSTGRES_PASSWORD: zerocode123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerocode -d zerocode_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"

volumes:
  postgres_data:
